name: agent-tester

services:
  server:
    build: .
    ports:
      - "3000:3000" # API
      - "3002:3002" # demo shop (runs in the same container so tests can open http://localhost:3002)
    env_file: .env
    environment:
      DATA_DIR: /data
      # /data holds run screenshots; all other state lives in Postgres.
      DATABASE_URL: postgres://agent:${POSTGRES_PASSWORD:-agent}@db:5432/agent_tester
    volumes:
      - server-data:/data
      - replay-cache:/app/runner/.cache
    depends_on:
      db:
        condition: service_healthy
    shm_size: 1gb # Chromium needs more shared memory than Docker's 64MB default
    restart: unless-stopped

  # All server state (Workspaces, Tests, Runs). Migrations run when the server starts.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent} # set it in server/.env for anything beyond local dev
      POSTGRES_DB: agent_tester
    ports:
      - "127.0.0.1:5432:5432" # local tools only; the server reaches it as db:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_tester"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  server-data:
  replay-cache:
  pg-data:
